# Semgrep rule pack: p/owasp (OWASP Top Ten 2021) - curated local cache.
# Layer-2 SAST rules mapping findings to OWASP Top Ten 2021 categories for the
# repository's TypeScript/JavaScript surface:
#   A01 Broken Access Control  - fail-open authorization guard (canActivate returns true).
#   A02 Cryptographic Failures - sensitive values written to console logs.
#   A03 Injection              - SQL injection via Prisma raw queries; XSS via dangerouslySetInnerHTML.
#   A05 Security Misconfig      - CSP 'unsafe-inline'/'unsafe-eval'; insecure cookie flags; permissive CORS with credentials.
#   A07 Auth Failures           - JWT 'none' algorithm or hard-coded signing secret.
#   A08 Data Integrity Failures - insecure deserialization via node-serialize unserialize().
#   A10 SSRF                     - outbound fetch/axios to a request-derived URL.
# Regex engine: Google RE2 (no lookahead/lookbehind/backreferences); (?i) toggles case-insensitivity.
# Loaded by: semgrep scan --config=security-audit/semgrep-rules --metrics=off <repo-root>
rules:
  # --- A01:2021 Broken Access Control ---
  - id: owasp.a01.guard-always-allows
    languages: [typescript, javascript]
    severity: WARNING
    message: "Authorization guard 'canActivate' returns true unconditionally, granting access to every request (fail-open access control)."
    pattern-either:
      - pattern: |
          canActivate(...) { return true; }
      - pattern: |
          canActivate(...): $T { return true; }
      - pattern: |
          async canActivate(...) { return true; }
      - pattern: |
          async canActivate(...): $T { return true; }
    metadata:
      cwe:
        - "CWE-862: Missing Authorization"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: MEDIUM
      technology: [nestjs]
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://cwe.mitre.org/data/definitions/862.html

  # --- A02:2021 Cryptographic Failures (sensitive data exposure) ---
  - id: owasp.a02.sensitive-data-in-logs
    languages: [typescript, javascript]
    severity: WARNING
    message: "Sensitive value (password/secret/token/key/credential) written to a console log, risking exposure in log sinks."
    patterns:
      - pattern-either:
          - pattern: console.log(..., $X, ...)
          - pattern: console.error(..., $X, ...)
          - pattern: console.warn(..., $X, ...)
          - pattern: console.info(..., $X, ...)
          - pattern: console.debug(..., $X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: '(?i)(password|passwd|pwd|secret|token|api[_-]?key|private[_-]?key|credential)'
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: LOW
      technology: [nodejs]
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://cwe.mitre.org/data/definitions/532.html

  # --- A03:2021 Injection ---
  - id: owasp.a03.prisma-raw-sql-unsafe
    languages: [typescript, javascript]
    severity: ERROR
    message: "Prisma raw query ($queryRaw/$executeRaw call form, or $queryRawUnsafe/$executeRawUnsafe) with a non-parameterized argument; use tagged-template parameterization to prevent SQL injection."
    pattern-regex: '\.\$(queryRaw|executeRaw)(Unsafe)?\s*(<[^>]*>)?\s*\('
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      technology: [prisma]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
        - https://cwe.mitre.org/data/definitions/89.html

  - id: owasp.a03.react-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: WARNING
    message: "React dangerouslySetInnerHTML is set from a non-constant value; rendering unsanitized HTML enables cross-site scripting (XSS)."
    patterns:
      - pattern-either:
          - pattern: |
              <$EL ... dangerouslySetInnerHTML={{__html: $X}} />
          - pattern: |
              {..., dangerouslySetInnerHTML: {__html: $X}, ...}
      - pattern-not: |
          <$EL ... dangerouslySetInnerHTML={{__html: "..."}} />
      - pattern-not: |
          {..., dangerouslySetInnerHTML: {__html: "..."}, ...}
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
      technology: [react]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
        - https://cwe.mitre.org/data/definitions/79.html

  # --- A05:2021 Security Misconfiguration ---
  - id: owasp.a05.csp-unsafe-directive
    languages: [typescript, javascript]
    severity: WARNING
    message: "Content-Security-Policy contains 'unsafe-inline' or 'unsafe-eval', weakening script/style XSS protections."
    patterns:
      - pattern-regex: "'unsafe-(inline|eval)'"
      - pattern-not-regex: '(//|/\*)[^\n]*''unsafe-(inline|eval)'''
    metadata:
      cwe:
        - "CWE-1021: Improper Restriction of Rendered UI Layers or Frames"
        - "CWE-693: Protection Mechanism Failure"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      confidence: MEDIUM
      technology: [nextjs]
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
        - https://cwe.mitre.org/data/definitions/1021.html

  - id: owasp.a05.insecure-cookie-flags
    languages: [typescript, javascript]
    severity: WARNING
    message: "Insecure cookie attribute (httpOnly:false, secure:false, or sameSite:'none') weakens session-cookie protection."
    pattern-either:
      - pattern: |
          {..., httpOnly: false, ...}
      - pattern: |
          {..., secure: false, ...}
      - pattern: |
          {..., sameSite: "none", ...}
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      confidence: MEDIUM
      technology: [express, nodejs]
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
        - https://cwe.mitre.org/data/definitions/614.html

  - id: owasp.a05.cors-wildcard-credentials
    languages: [typescript, javascript]
    severity: WARNING
    message: "CORS enables credentials with a permissive origin (true or '*'), exposing authenticated responses to any origin."
    patterns:
      - pattern: cors($OPTS)
      - metavariable-pattern:
          metavariable: $OPTS
          patterns:
            - pattern: |
                {..., credentials: true, ...}
            - pattern-either:
                - pattern: |
                    {..., origin: true, ...}
                - pattern: |
                    {..., origin: "*", ...}
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      confidence: MEDIUM
      technology: [express]
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
        - https://cwe.mitre.org/data/definitions/942.html

  # --- A07:2021 Identification and Authentication Failures ---
  - id: owasp.a07.jwt-none-or-hardcoded-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: "JWT signed or verified with the 'none' algorithm or a hard-coded string secret, enabling token forgery."
    pattern-either:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: jwt.sign($PAYLOAD, "...")
      - patterns:
          - pattern-either:
              - pattern: jwt.sign(...)
              - pattern: jwt.verify(...)
          - pattern-regex: 'algorithms?\s*:\s*\[?\s*["'']none["'']'
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      technology: [jsonwebtoken]
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
        - https://cwe.mitre.org/data/definitions/347.html

  # --- A08:2021 Software and Data Integrity Failures ---
  - id: owasp.a08.insecure-deserialization
    languages: [typescript, javascript]
    severity: ERROR
    message: "Insecure deserialization via node-serialize 'unserialize()' can execute attacker-controlled code from untrusted input."
    pattern-either:
      - pattern: $S.unserialize(...)
      - pattern: unserialize(...)
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      confidence: MEDIUM
      technology: [nodejs]
      references:
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
        - https://cwe.mitre.org/data/definitions/502.html

  # --- A10:2021 Server-Side Request Forgery (SSRF) ---
  - id: owasp.a10.ssrf-user-controlled-url
    languages: [typescript, javascript]
    severity: WARNING
    message: "Outbound request (fetch/axios) uses a URL derived directly from request input, enabling server-side request forgery (SSRF)."
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: fetch($URL)
          - pattern: axios.get($URL, ...)
          - pattern: axios.post($URL, ...)
          - pattern: axios($URL, ...)
          - pattern: axios($URL)
      - metavariable-pattern:
          metavariable: $URL
          pattern-either:
            - pattern: $REQ.query.$F
            - pattern: $REQ.body.$F
            - pattern: $REQ.params.$F
            - pattern: $REQ.query
            - pattern: $REQ.nextUrl.searchParams.get(...)
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      confidence: MEDIUM
      technology: [express, nextjs]
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
        - https://cwe.mitre.org/data/definitions/918.html
