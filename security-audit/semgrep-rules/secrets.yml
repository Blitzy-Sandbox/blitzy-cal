# Semgrep rule pack: p/secrets (curated local cache).
# Layer-2 SAST rules detecting committed secrets / hard-coded credentials
# (CWE-798, CWE-321, CWE-522) in source, configuration, and the committed env
# templates .env.example and .env.appStore.example.
# Regex engine: Google RE2 (no lookahead/lookbehind/backreferences); (?i) toggles case-insensitivity.
# Loaded by: semgrep scan --config=security-audit/semgrep-rules --metrics=off <repo-root>
rules:
  - id: secrets.generic.high-entropy-assignment
    languages: [generic]
    severity: WARNING
    message: "Possible hard-coded secret assigned to a credential-named variable; move it to a secret manager or environment variable and rotate it."
    patterns:
      - pattern-regex: '(?i)(secret|passwd|password|pwd|api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|auth[_-]?token|token|private[_-]?key)[ \t]*[:=][ \t]*["'']?([A-Za-z0-9+/=_\-]{16,})["'']?'
      - pattern-not-regex: '(?i)(your[_-]|example|changeme|placeholder|dummy|sample|test|xxxx|redacted|<[^>]*>|process\.env|import\.meta|\$\{|\$\()'
    paths:
      include:
        - "*.env*"
        - ".env.example"
        - ".env.appStore.example"
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
        - "*.yml"
        - "*.yaml"
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: MEDIUM
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.aws.access-key-id
    languages: [generic]
    severity: ERROR
    message: "Hard-coded AWS Access Key ID detected; rotate it in AWS IAM and load it from a secret manager."
    pattern-regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html

  - id: secrets.aws.secret-access-key
    languages: [generic]
    severity: ERROR
    message: "Possible hard-coded AWS Secret Access Key near an AWS secret/access context; rotate the key and load it from a secret manager."
    pattern-regex: '(?i)aws(.{0,20})?(secret|access).{0,20}["'']([A-Za-z0-9/+=]{40})["'']'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: MEDIUM
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.pem.private-key
    languages: [generic]
    severity: ERROR
    message: "Private key block (PEM) detected in the repository; remove and rotate the key and store it in a secret manager or HSM."
    pattern-regex: "-----BEGIN ([A-Z]+ )?PRIVATE KEY-----"
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/321.html
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.github.token
    languages: [generic]
    severity: ERROR
    message: "Hard-coded GitHub token detected; revoke it in GitHub settings and load it from a secret manager."
    pattern-regex: '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github

  - id: secrets.slack.token
    languages: [generic]
    severity: ERROR
    message: "Hard-coded Slack token detected; revoke it in Slack and load it from a secret manager."
    pattern-regex: '\bxox[baprs]-[0-9A-Za-z-]{10,}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.stripe.secret-key
    languages: [generic]
    severity: ERROR
    message: "Hard-coded Stripe live secret/restricted key detected; roll the key in the Stripe dashboard and load it from a secret manager."
    pattern-regex: '\b(sk|rk)_live_[0-9A-Za-z]{24,}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://stripe.com/docs/keys

  - id: secrets.google.api-key
    languages: [generic]
    severity: ERROR
    message: "Hard-coded Google API key detected; restrict or delete the key in Google Cloud Console and load it from a secret manager."
    pattern-regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.sendgrid.api-key
    languages: [generic]
    severity: ERROR
    message: "Hard-coded SendGrid API key detected; revoke it in SendGrid and load it from a secret manager."
    pattern-regex: '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.url.basic-auth-credentials
    languages: [generic]
    severity: WARNING
    message: "Credentials embedded in a URL or connection string (scheme://user:password@host); remove inline credentials and load them from a secret manager."
    patterns:
      - pattern-regex: '[a-zA-Z][a-zA-Z0-9+.\-]*://[^:@\s/]+:[^@\s/]{6,}@'
      - pattern-not-regex: "(?i):(password|changeme|placeholder|example|your[_-]|dummy|sample|<[^>]*>|xxxx|user|pass)@"
    metadata:
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/522.html
        - https://cwe.mitre.org/data/definitions/798.html

  - id: secrets.jwt.hardcoded-token
    languages: [generic]
    severity: INFO
    message: "Possible hard-coded JSON Web Token (JWT) literal detected; if it is a real token, revoke it and load tokens at runtime from a secret manager."
    pattern-regex: '\beyJ[A-Za-z0-9_=\-]{8,}\.eyJ[A-Za-z0-9_=\-]{8,}\.[A-Za-z0-9_=\-]{8,}\b'
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/798.html
